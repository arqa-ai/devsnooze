  <line x1="28" y1="246" x2="852" y2="246" stroke="#2a3042"/>
  <text x="28" y="280" fill="#e6e9f2">A proxy holds the port. The real server starts on the first page load,</text>
  <text x="28" y="304" fill="#e6e9f2">sleeps after 20 min without requests, and HMR pings can't wake it.</text>
  <text x="28" y="344" fill="#7d869c">npx devsnooze run -- npm run dev</text>
